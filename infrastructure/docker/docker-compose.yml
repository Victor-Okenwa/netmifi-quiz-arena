name: netmifi-quiz-arena

services:
  postgres:
    image: postgres:16-alpine
    container_name: netmifi-quiz-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmifi_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-netmifi_quiz_arena}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - netmifi_quiz_arena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-netmifi} -d $${POSTGRES_DB:-netmifi_quiz_arena}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netmifi_quiz_arena_pgdata:
